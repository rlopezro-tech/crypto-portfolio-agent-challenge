services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./execution_logs:/app/execution_logs
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AI_PROVIDER: ${AI_PROVIDER:-openai_compatible}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.groq.com/openai/v1}
      AI_MODEL: ${AI_MODEL:-openai/gpt-oss-20b}
      AI_API_KEY: ${AI_API_KEY:-}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-demo}
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:-}
      MARKET_DATA_BASE_URL: ${MARKET_DATA_BASE_URL:-https://pro-api.coinmarketcap.com}
      EXECUTION_LOG_ENABLED: ${EXECUTION_LOG_ENABLED:-true}
      EXECUTION_LOG_DIR: ${EXECUTION_LOG_DIR:-execution_logs}
